<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Builder</title>
<style>:root {
  --bg: #f5f6f8; --surface: #fff; --surface-2: #f0f2f5; --border: #dfe3e8; --text: #1d2330; --muted: #677085;
  --accent: #2456d6; --accent-ink: #fff; --accent-soft: #e8eefc;
  --good: #1d7a46; --good-soft: #e6f4ec; --bad: #c0352b; --bad-soft: #fcebea; --warn: #a76200; --warn-soft: #fff4e0;
  --edited: #e3ecff; --edited-ink: #1d3f99; --row-warn: #fff6d6; --row-error: #fde6e4; --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
/* dark palette: used when the toggle says dark, or before the script runs on a dark system */
:root[data-theme="dark"] {
  --bg: #14171c; --surface: #1c2027; --surface-2: #232832; --border: #313845; --text: #e6e9ef; --muted: #98a1b3;
  --accent: #5b8cff; --accent-ink: #0b1020; --accent-soft: #22304f;
  --good: #5cc98a; --good-soft: #17301f; --bad: #ff7a70; --bad-soft: #3a1c1a; --warn: #f0b04a; --warn-soft: #3a2c12;
  --edited: #1f2f55; --edited-ink: #a9c3ff; --row-warn: #332a12; --row-error: #3a1d1b; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #14171c; --surface: #1c2027; --surface-2: #232832; --border: #313845; --text: #e6e9ef; --muted: #98a1b3;
    --accent: #5b8cff; --accent-ink: #0b1020; --accent-soft: #22304f;
    --good: #5cc98a; --good-soft: #17301f; --bad: #ff7a70; --bad-soft: #3a1c1a; --warn: #f0b04a; --warn-soft: #3a2c12;
    --edited: #1f2f55; --edited-ink: #a9c3ff; --row-warn: #332a12; --row-error: #3a1d1b; color-scheme: dark;
  }
}
.theme-btn { display: inline-grid; place-items: center; padding: 6px 9px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); min-height: 100vh; }
h2 { font-size: 16px; margin: 0 0 2px; }
code { font-family: var(--mono); background: var(--surface-2); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); font-weight: 400; }
.hint { color: var(--muted); margin: 0; font-size: 13px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 15px; margin-right: 8px; white-space: nowrap; }
.version { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px; }
.project-chip { display: flex; gap: 10px; align-items: baseline; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 999px; padding: 4px 14px; cursor: pointer; font: inherit; }
.project-chip span { color: var(--muted); }
.project-chip:hover { border-color: var(--accent); }
.save-state { color: var(--muted); font-size: 13px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-state.dirty { color: var(--warn); }
.spacer { flex: 1; }

/* buttons */
.btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font: inherit; }
.icon-btn:hover { background: var(--bad-soft); color: var(--bad); }

/* tabs */
.tabs { display: flex; gap: 4px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { font: inherit; border: 0; background: none; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.step { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); font-size: 12px; }
.tabs button.active .step { background: var(--accent); color: var(--accent-ink); }
.count { font-size: 12px; color: var(--muted); }
.count.bad { color: var(--bad); font-weight: 600; }

main { padding: 20px; max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } main { padding: 12px; } }

textarea, input[type=search], input:not([type]), input[type=number], .code-input {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { resize: vertical; }
textarea.mono { font: 12px/1.5 var(--mono); white-space: pre; overflow-x: auto; }
textarea:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
input.code-input { width: 90px; }
input[type=search] { width: 220px; }
.check { display: flex; gap: 6px; align-items: center; color: var(--muted); }
details summary { cursor: pointer; color: var(--muted); }
details textarea { margin-top: 8px; }

.status { font-size: 13px; color: var(--muted); }
.status.good { color: var(--good); }
.status.bad, .bad-text { color: var(--bad); }
.empty { color: var(--muted); padding: 16px 0; margin: 0; }
.banner { padding: 10px 14px; border-radius: var(--radius); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner a { color: inherit; font-weight: 600; }

/* warnings */
.warnings summary { display: flex; gap: 10px; align-items: center; list-style: none; }
.warnings summary::-webkit-details-marker { display: none; }
.warnings summary h2 { margin: 0; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; }
.pill.error { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--surface-2); color: var(--muted); }
.warnings ul { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow: auto; }
.warnings li { display: flex; gap: 8px; align-items: baseline; }
.lvl { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 700; flex: none; }
li.error .lvl { background: var(--bad-soft); color: var(--bad); }
li.warn .lvl { background: var(--warn-soft); color: var(--warn); }
li.info .lvl { background: var(--surface-2); color: var(--muted); }

/* tables */
.table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 6px; max-height: 60vh; }
.table-wrap.tall { max-height: calc(100vh - 260px); min-height: 200px; }
.table-wrap.short { max-height: 320px; }
table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
.grid th, .grid td { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 5px 8px; text-align: left; vertical-align: top; max-width: 320px; }
.grid thead th { position: sticky; top: 0; background: var(--surface-2); z-index: 2; font-weight: 600; white-space: nowrap; }
.grid tbody th { font-weight: 600; background: var(--surface); white-space: nowrap; }
.grid td[contenteditable] { cursor: text; min-width: 60px; }
.grid td[contenteditable]:hover { background: var(--surface-2); }
.grid td[contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--surface); }
.grid tr.issue-warn > * { background: var(--row-warn); }
.grid tr.issue-error > * { background: var(--row-error); }
.grid td.edited, .grid tr > td.edited { background: var(--edited); color: var(--edited-ink); }
.grid tr.selected > * { background: var(--accent-soft); }
.grid tr.flash > * { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: inset 0 0 0 999px var(--accent-soft); } 100% { box-shadow: none; } }
.grid .sticky { position: sticky; left: 0; z-index: 1; }
.grid thead .sticky { z-index: 3; }
.review .s0 { left: 0; min-width: 110px; }
.review .s1 { left: 110px; min-width: 170px; }
.grid tr.issue-warn th.s0 { box-shadow: inset 3px 0 0 var(--warn); }
.grid tr.issue-error th.s0 { box-shadow: inset 3px 0 0 var(--bad); }
.manual .item-col { display: flex; align-items: center; gap: 4px; min-width: 120px; }
.row-pick { display: inline-flex; padding: 2px; cursor: pointer; }
.row-pick input { margin: 0; cursor: pointer; }
.warnings li.link { cursor: pointer; border-radius: 4px; }
.warnings li.link:hover { background: var(--surface-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.toast { display: flex; gap: 14px; align-items: center; }
.toast-action { font: inherit; font-weight: 600; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; pointer-events: auto; }
.toast.show { pointer-events: auto; }
.file-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 6px; }
.file-list li { display: flex; gap: 12px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); }
.file-list li:last-child { border-bottom: 0; }
.file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dropzone.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; background: var(--accent-soft); }
.drop-hint { text-align: center; border: 1px dashed var(--border); border-radius: 6px; }
.badges { display: inline-flex; gap: 2px; margin-left: 6px; }
.badges i { font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); background: var(--surface-2); border-radius: 3px; padding: 0 3px; }
.row-tools { white-space: nowrap; }

/* export: tick rows and columns to include */
.table-wrap.export { max-height: 55vh; }
.pick-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pick-bar .hint { margin-left: 8px; }
.btn.small { padding: 3px 10px; font-size: 13px; }
.grid.pick th.pick-col { width: 34px; min-width: 34px; text-align: center; }
.grid.pick input { cursor: pointer; margin: 0; }
.col-pick { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.grid.pick .off, .grid.pick tr.off > td { color: var(--muted); opacity: .45; }
.grid.pick thead th.off { opacity: .6; }
.grid.pick tr.off > th { opacity: .7; }

/* dialogs */
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); padding: 24px; width: min(460px, calc(100vw - 32px)); }
dialog.wide { width: min(1100px, calc(100vw - 32px)); }
dialog::backdrop { background: rgb(10 14 22 / .45); }
dialog form { display: flex; flex-direction: column; gap: 12px; }
dialog label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
dialog label input { font-weight: 400; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.preview { color: var(--accent); font-family: var(--mono); font-size: 13px; margin: 0; min-height: 1.4em; }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
#modelsBody { display: flex; flex-direction: column; gap: 10px; }
#modelsBody > .btn { align-self: flex-start; }
.subtabs { display: flex; gap: 4px; flex-wrap: wrap; }
.subtabs button { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.subtabs button.active { background: var(--accent-soft); border-color: var(--accent); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px; transition: .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.toast.bad { background: var(--bad); color: #fff; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Audit Builder <span class="version" title="Version of this app. Compare with the newest zip in the shared folder.">2026-10-07 1445</span></div>
  <button id="projectChip" class="project-chip" title="Edit project settings"></button>
  <span id="saveState" class="save-state"></span>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnNew">New</button>
  <button class="btn ghost" id="btnOpen" title="Open a saved project (.audit.json) or import an old Audit.xlsm">Open…</button>
  <button class="btn" id="btnSave" title="Save (Ctrl+S)">Save project</button>
  <button class="btn ghost" id="btnSaveAs" title="Save to a different file (Ctrl+Shift+S)">Save as…</button>
  <button class="btn ghost" id="btnModels">Models</button>
  <button class="btn ghost theme-btn" id="btnTheme" aria-label="Toggle light or dark mode"></button>
  <input type="file" id="openFile" accept=".json,.xlsm,.xlsx" hidden>
</header>

<nav id="tabs" class="tabs">
  <button data-tab="data"><span class="step">1</span>Data<span class="count"></span></button>
  <button data-tab="manual"><span class="step">2</span>Manual entries<span class="count"></span></button>
  <button data-tab="review"><span class="step">3</span>Review<span class="count"></span></button>
  <button data-tab="export"><span class="step">4</span>Export<span class="count"></span></button>
</nav>

<main id="main"></main>

<dialog id="setupDialog">
  <form id="setupForm" method="dialog">
    <h2>Project setup</h2>
    <p class="hint">These are used for every item code and on the report. You can change them later by clicking the project name at the top.</p>
    <label>Project number<input name="projectNumber" required placeholder="SHR11734" autocomplete="off"></label>
    <label>End client<input name="endClient" required placeholder="Client name" autocomplete="off"></label>
    <label>Item code prefix<input name="prefix" required placeholder="GG" pattern="[A-Za-z0-9]+" title="Letters and numbers only" autocomplete="off"></label>
    <p id="setupPreview" class="preview"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="setupCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="modelsDialog" class="wide">
  <div class="dialog-head">
    <h2>Models</h2>
    <div class="actions">
      <button class="btn ghost" id="modelsImport">Import…</button>
      <button class="btn ghost" id="modelsExport">Export</button>
      <button class="btn ghost" id="modelsReset">Reset to defaults</button>
      <button class="btn primary" id="modelsClose">Done</button>
    </div>
    <input type="file" id="modelsFile" accept=".json" hidden>
  </div>
  <div id="modelsBody"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
